<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock Interview</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    button { padding: 12px 22px; font-size: 16px; cursor: pointer; border-radius: 8px; border: 1px solid #999; background: #fff; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #status { color: #666; margin: 16px 0; min-height: 24px; }
    .turn { margin: 14px 0; padding: 12px 14px; border-radius: 8px; }
    .interviewer { background: #eef2fb; }
    .candidate { background: #f2f2ef; }
    .meta { font-size: 12px; color: #777; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Mock interview</h1>
  <p id="phase" style="color:#555;font-size:14px"></p>
  <div id="resumeBox">
  <input type="file" id="resumeFile" accept=".pdf" />
  <button id="uploadResume">Upload resume</button>
  <span id="resumeStatus" style="font-size:13px;color:#666;margin-left:8px"></span>
</div>
<button id="start">Start interview</button>
  <button id="answer" disabled>Hold to answer</button>
  <button id="end" disabled>End interview</button>
  <p id="status"></p>
  <div id="transcript"></div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) document.getElementById("status").textContent = "Use Chrome or Edge — this browser lacks speech recognition.";

let sessionId = null;
let recognition = null;

const $status = document.getElementById("status");
const $transcript = document.getElementById("transcript");
const $start = document.getElementById("start");
const $answer = document.getElementById("answer");
const $phase = document.getElementById("phase");
const $end = document.getElementById("end");
const $resumeFile = document.getElementById("resumeFile");
const $uploadResume = document.getElementById("uploadResume");
const $resumeStatus = document.getElementById("resumeStatus");

function render(role, text, meta) {
  const div = document.createElement("div");
  div.className = "turn " + role;
  div.innerHTML = `<strong>${role === "interviewer" ? "Interviewer" : "You"}:</strong> ${text}`
    + (meta ? `<div class="meta">${meta}</div>` : "");
  $transcript.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function speak(text) {
  return new Promise((resolve) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function listen() {
  return new Promise((resolve, reject) => {
    recognition = new SR();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.continuous = true;
    let finalText = "";

    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
      }
    };
    recognition.onerror = (e) => reject(new Error(e.error));
    recognition.onend = () => resolve(finalText.trim());
    recognition.start();
  });
}
async function createSession() {
  const res = await fetch("/api/session", { method: "POST" });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  sessionId = data.sessionId;
  return data;
}

$uploadResume.onclick = async () => {
  const file = $resumeFile.files[0];
  if (!file) { $resumeStatus.textContent = "Choose a PDF first."; return; }

  try {
    if (!sessionId) await createSession();

    $resumeStatus.textContent = "Reading resume…";
    $uploadResume.disabled = true;

    const formData = new FormData();
    formData.append("resume", file);

    const res = await fetch(`/api/session/${sessionId}/resume`, {
      method: "POST",
      body: formData,
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    const projectNames = data.resumeSummary.projects.map((p) => p.name).join(", ") || "none found";
    $resumeStatus.textContent = `Loaded — role: ${data.role}. Projects: ${projectNames}`;
  } catch (err) {
    $resumeStatus.textContent = "Could not read resume: " + err.message;
  } finally {
    $uploadResume.disabled = false;
  }
};

$start.onclick = async () => {
  $start.disabled = true;
  $status.textContent = "Starting…";
  try {
    if (!sessionId) await createSession();

    $phase.textContent = `Phase: warmup · Difficulty: 2/5`;
    const opening = "Hi, thanks for joining. Let's start simple. Tell me about a project you've built recently.";
    render("interviewer", opening);
    await speak(opening);
    $status.textContent = "Your turn — hold the button and answer.";
    $answer.disabled = false;
    $end.disabled = false;
  } catch (err) {
    $status.textContent = "Could not start: " + err.message;
    $start.disabled = false;
  }
};
let isListening = false;

$answer.onclick = async () => {
  if (!isListening) {
    isListening = true;
    $status.textContent = "Listening…";
    $answer.textContent = "Stop and send";
    try {
      const promise = listen();
      recognition._stopRequested = false;
      const text = await promise;
      isListening = false;
      $answer.textContent = "Hold to answer";

      if (!text) { $status.textContent = "Didn't catch that — try again."; return; }

      render("candidate", text);
      $status.textContent = "Thinking…";
      $answer.disabled = true;

      const res = await fetch("/api/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, text }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      render("interviewer", data.speech, `${data.latencyMs}ms · ${data.assessment} · L${data.difficulty}`);
      $phase.textContent = `Phase: ${data.phase} · Difficulty: ${data.difficulty}/5`;
      await speak(data.speech);

      $answer.disabled = false;
      $status.textContent = "Your turn.";
    } catch (err) {
      isListening = false;
      $status.textContent = "Error: " + err.message;
      $answer.disabled = false;
      $answer.textContent = "Hold to answer";
    }
  } else {
    recognition && recognition.stop();
  }
};

$end.onclick = async () => {
  try {
    const res = await fetch(`/api/session/${sessionId}/end`, { method: "POST" });
    const { stats } = await res.json();
    $status.textContent = `Done — ${stats.turnCount} turns, peak difficulty ${stats.peakDifficulty}/5, `
      + `avg ${stats.avgDifficulty}, p50 ${stats.p50LatencyMs}ms · `
      + `${stats.assessments.strong} strong / ${stats.assessments.partial} partial / ${stats.assessments.weak} weak`;
    $answer.disabled = true;
    $end.disabled = true;
  } catch (err) {
    $status.textContent = "Could not end: " + err.message;
  }
};
</script>
</body>
</html>
