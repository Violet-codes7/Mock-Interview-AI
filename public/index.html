<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .sticky-controls {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #0d1117;
  padding: 16px 0 8px;
  margin: 0 -24px;
  padding-left: 24px;
  padding-right: 24px;
  border-bottom: 1px solid #232b3d;
}
  * { box-sizing: border-box; }
  .mode-btn { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 8px 14px; border-radius: 8px; border: 1px solid #2a3350; background: transparent; color: #9aa3b8; box-shadow: none; }
.mode-btn:hover:not(:disabled) { background: #1a2235; transform: none; }
.mode-btn.active { background: #f0b429; color: #22190a; border-color: #f0b429; }
.mode-btn:disabled { opacity: 0.5; }
  body { font-family: 'Inter', system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; background: #0d1117; color: #e6e9f2; line-height: 1.6; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #6b7385; text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.5px; margin: 0 0 24px; color: #f4f5f8; }
  .session-bar { background: #161d2b; border: 1px solid #232b3d; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .phase-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9aa3b8; text-transform: uppercase; letter-spacing: 1px; }
  .phase-value { color: #f0b429; font-weight: 500; }
  .meter { display: flex; align-items: center; gap: 10px; }
  .meter-bars { display: flex; gap: 3px; }
  .meter-bar { width: 6px; height: 16px; border-radius: 2px; background: #232b3d; transition: background 0.3s ease; }
  .meter-bar.filled { background: #f0b429; }
  .meter-bar:nth-child(1) { height: 10px; } .meter-bar:nth-child(2) { height: 13px; } .meter-bar:nth-child(3) { height: 16px; } .meter-bar:nth-child(4) { height: 19px; } .meter-bar:nth-child(5) { height: 22px; }
  .card { background: #161d2b; border: 1px solid #232b3d; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  input[type="file"] { font-size: 13px; color: #9aa3b8; max-width: 190px; }
  input[type="file"]::file-selector-button { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; padding: 8px 14px; border-radius: 8px; border: 1px solid #2a3350; background: #1e2740; color: #d6dae5; cursor: pointer; margin-right: 10px; }
  .controls { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  button { font-family: 'Inter', sans-serif; padding: 13px 22px; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 10px; border: none; transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease; }
  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { background: #1b2233 !important; color: #4a5268 !important; cursor: not-allowed; box-shadow: none !important; }
  #start { background: #f0b429; color: #22190a; box-shadow: 0 2px 10px rgba(240, 180, 41, 0.25); }
  #answer { background: #3ddc84; color: #06210f; box-shadow: 0 2px 10px rgba(61, 220, 132, 0.2); }
  #answer.recording { background: #ff5c72; color: #2b0509; box-shadow: 0 2px 14px rgba(255, 92, 114, 0.35); }
  #uploadResume, #end { background: transparent; color: #c3c9d9; border: 1px solid #2a3350; }
  #uploadResume:hover:not(:disabled), #end:hover:not(:disabled) { background: #1a2235; transform: none; }
  .live { display: none; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #ff8a9a; letter-spacing: 1px; }
  .live.active { display: flex; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5c72; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,92,114,0.5); } 50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(255,92,114,0); } }
  .wave { display: flex; align-items: center; gap: 2px; height: 14px; }
  .wave span { width: 3px; background: #ff5c72; border-radius: 2px; animation: wave 0.9s ease-in-out infinite; }
  .wave span:nth-child(1) { animation-delay: 0s; } .wave span:nth-child(2) { animation-delay: 0.15s; } .wave span:nth-child(3) { animation-delay: 0.3s; } .wave span:nth-child(4) { animation-delay: 0.45s; } .wave span:nth-child(5) { animation-delay: 0.6s; }
  @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  .timer { display: none; align-items: baseline; gap: 6px; font-family: 'IBM Plex Mono', monospace; }
  .timer.active { display: flex; }
  .timer-label { font-size: 11px; color: #6b7385; text-transform: uppercase; letter-spacing: 1px; }
  .timer-value { font-size: 15px; font-weight: 500; color: #9aa3b8; }
  .timer-value.timer-warn { color: #f0b429; }
  .timer-value.timer-danger { color: #ff5c72; }
  #status, #resumeStatus { font-family: 'IBM Plex Mono', monospace; color: #6b7385; font-size: 13px; margin: 4px 0 24px; min-height: 18px; }
  #transcript { display: flex; flex-direction: column; gap: 14px; }
  .turn { padding: 16px 18px; border-radius: 14px; max-width: 85%; animation: slideIn 0.25s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .interviewer { background: #161d2b; border: 1px solid #232b3d; align-self: flex-start; }
  .candidate { background: #4d3fb0; color: #fff; align-self: flex-end; }
  .turn strong { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.55; margin-bottom: 6px; font-weight: 500; }
  .meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 10px; font-weight: 500; letter-spacing: 0.3px; }
  .meta.strong { color: #3ddc84; } .meta.partial { color: #f0b429; } .meta.weak { color: #ff5c72; }
  .candidate .meta { color: rgba(255,255,255,0.65); }

  .summary { display: none; background: #161d2b; border: 1px solid #232b3d; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .summary.active { display: block; }
  .summary-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: #f4f5f8; margin: 0 0 4px; }
  .summary-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b7385; margin: 0 0 20px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-cell { background: #1e2740; border-radius: 10px; padding: 14px 12px; text-align: center; }
  .stat-num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 500; color: #f4f5f8; }
  .stat-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #9aa3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .breakdown-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9aa3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .breakdown-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #1e2740; margin-bottom: 8px; }
  .breakdown-seg { height: 100%; }
  .breakdown-seg.strong { background: #3ddc84; }
  .breakdown-seg.partial { background: #f0b429; }
  .breakdown-seg.weak { background: #ff5c72; }
  .breakdown-legend { display: flex; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9aa3b8; }
  .breakdown-legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.strong { background: #3ddc84; } .dot.partial { background: #f0b429; } .dot.weak { background: #ff5c72; }
</style>
</head>
<body>
  <div class="eyebrow">Voice interview session</div>
  <h1>Interview Room</h1>
  <div class="card" id="modeBox">
  <span class="phase-label">Question focus</span>
  <button class="mode-btn" data-mode="resume">Resume-focused</button>
  <button class="mode-btn" data-mode="fundamentals">Fundamentals-focused</button>
  <button class="mode-btn active" data-mode="balanced">Balanced</button>
</div>

  <div class="session-bar">
    <div>
      <span class="phase-label">Phase</span>
      <span class="phase-value" id="phaseText">—</span>
    </div>
    <div class="meter">
      <span class="phase-label">Difficulty</span>
      <div class="meter-bars" id="meterBars">
        <div class="meter-bar"></div><div class="meter-bar"></div><div class="meter-bar"></div><div class="meter-bar"></div><div class="meter-bar"></div>
      </div>
    </div>
  </div>

 <div class="card" id="resumeBox" style="display:none;">
  <input type="file" id="resumeFile" accept=".pdf" />
  <button id="uploadResume">Upload resume</button>
</div>
<p id="resumeStatus"></p>

<div class="sticky-controls">
  <div class="controls">
    <button id="start">Start interview</button>
    <button id="answer" disabled>Start answering</button>
    <button id="end" disabled>End interview</button>
    <div class="live" id="liveIndicator">
      <div class="live-dot"></div>
      <span>LIVE</span>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="timer" id="timerDisplay">
      <span class="timer-label">Time left</span>
      <span class="timer-value" id="timerValue">--</span>
    </div>
  </div>
  <p id="status"></p>
</div>

  <div class="summary" id="summaryCard"></div>

  <div id="transcript"></div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) document.getElementById("status").textContent = "Use Chrome or Edge — this browser lacks speech recognition.";

const TIME_BUDGET = { 1: 60, 2: 75, 3: 90, 4: 120, 5: 150 };
const GRACE_SECONDS = 10;

let sessionId = null;
let recognition = null;
let isListening = false;
let currentDifficulty = 2;
let questionTimerInterval = null;
let timeRemaining = 0;
let graceUsed = false;
let questionStartTime = 0;
let timedOut = false;

const $status = document.getElementById("status");
const $transcript = document.getElementById("transcript");
const $start = document.getElementById("start");
const $answer = document.getElementById("answer");
const $end = document.getElementById("end");
const $resumeFile = document.getElementById("resumeFile");
const $uploadResume = document.getElementById("uploadResume");
const $resumeStatus = document.getElementById("resumeStatus");
const $phaseText = document.getElementById("phaseText");
const $meterBars = document.getElementById("meterBars").children;
const $liveIndicator = document.getElementById("liveIndicator");
const $timerDisplay = document.getElementById("timerDisplay");
const $timerValue = document.getElementById("timerValue");
const $summaryCard = document.getElementById("summaryCard");
let selectedMode = "balanced";
const $modeButtons = document.querySelectorAll(".mode-btn");
const $resumeBox = document.getElementById("resumeBox");

$modeButtons.forEach((btn) => {
  btn.onclick = () => {
    if (sessionId) return;
    selectedMode = btn.dataset.mode;
    $modeButtons.forEach((b) => b.classList.toggle("active", b === btn));
    $resumeBox.style.display = selectedMode === "resume" ? "flex" : "none";
  };
});

function setPhase(phase, difficulty) {
  $phaseText.textContent = phase;
  currentDifficulty = difficulty;
  for (let i = 0; i < 5; i++) {
    $meterBars[i].classList.toggle("filled", i < difficulty);
  }
}

function setLive(on) {
  $liveIndicator.classList.toggle("active", on);
  $answer.classList.toggle("recording", on);
}

function updateTimerDisplay() {
  const m = Math.floor(timeRemaining / 60);
  const s = timeRemaining % 60;
  $timerValue.textContent = `${m}:${s.toString().padStart(2, "0")}`;
  $timerValue.classList.toggle("timer-warn", timeRemaining <= 15 && timeRemaining > 5);
  $timerValue.classList.toggle("timer-danger", timeRemaining <= 5);
}

function stopQuestionTimer() {
  if (questionTimerInterval) clearInterval(questionTimerInterval);
  questionTimerInterval = null;
  $timerDisplay.classList.remove("active");
}

function beginQuestionTimer() {
  stopQuestionTimer();
  graceUsed = false;
  timedOut = false;
  questionStartTime = Date.now();
  timeRemaining = TIME_BUDGET[currentDifficulty] || 75;
  updateTimerDisplay();
  $timerDisplay.classList.add("active");

  questionTimerInterval = setInterval(() => {
    timeRemaining--;
    if (timeRemaining <= 0) {
      if (!graceUsed) {
        graceUsed = true;
        timeRemaining = GRACE_SECONDS;
        $status.textContent = "10 seconds left — wrap it up";
        updateTimerDisplay();
        return;
      }
      clearInterval(questionTimerInterval);
      questionTimerInterval = null;
      timedOut = true;
      if (isListening && recognition) {
        recognition.stop();
      } else {
        submitTurn("(No answer was given before time ran out.)", Date.now() - questionStartTime);
      }
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function render(role, text, meta, assessment) {
  const div = document.createElement("div");
  div.className = "turn " + role;
  div.innerHTML = `<strong>${role === "interviewer" ? "Interviewer" : "You"}:</strong> ${text}`
    + (meta ? `<div class="meta ${assessment || ''}">${meta}</div>` : "");
  $transcript.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function renderSummary(stats) {
  const total = stats.assessments.strong + stats.assessments.partial + stats.assessments.weak;
  const pct = (n) => (total ? Math.round((n / total) * 100) : 0);
  const strongPct = pct(stats.assessments.strong);
  const partialPct = pct(stats.assessments.partial);
  const weakPct = pct(stats.assessments.weak);
  const avgResp = stats.avgResponseTimeMs ? (stats.avgResponseTimeMs / 1000).toFixed(1) + "s" : "—";

  $summaryCard.innerHTML = `
    <p class="summary-title">Session complete</p>
    <p class="summary-sub">${stats.turnCount} turns answered</p>
    <div class="stat-grid">
      <div class="stat-cell"><div class="stat-num">${stats.peakDifficulty ?? "—"}/5</div><div class="stat-lbl">Peak difficulty</div></div>
      <div class="stat-cell"><div class="stat-num">${stats.avgDifficulty ?? "—"}</div><div class="stat-lbl">Avg difficulty</div></div>
      <div class="stat-cell"><div class="stat-num">${avgResp}</div><div class="stat-lbl">Avg response</div></div>
      <div class="stat-cell"><div class="stat-num">${stats.p50LatencyMs ?? "—"}ms</div><div class="stat-lbl">Reply speed p50</div></div>
      <div class="stat-cell"><div class="stat-num">${stats.p95LatencyMs ?? "—"}ms</div><div class="stat-lbl">Reply speed p95</div></div>
      <div class="stat-cell"><div class="stat-num">${strongPct}%</div><div class="stat-lbl">Strong answers</div></div>
    </div>
    <div class="breakdown-lbl">Answer quality</div>
    <div class="breakdown-bar">
      <div class="breakdown-seg strong" style="width:${strongPct}%"></div>
      <div class="breakdown-seg partial" style="width:${partialPct}%"></div>
      <div class="breakdown-seg weak" style="width:${weakPct}%"></div>
    </div>
    <div class="breakdown-legend">
      <span><span class="dot strong"></span>Strong · ${stats.assessments.strong}</span>
      <span><span class="dot partial"></span>Partial · ${stats.assessments.partial}</span>
      <span><span class="dot weak"></span>Weak · ${stats.assessments.weak}</span>
    </div>
  `;
  $summaryCard.classList.add("active");
  $summaryCard.scrollIntoView({ behavior: "smooth", block: "start" });
}

function speak(text) {
  return new Promise((resolve) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function listen() {
  return new Promise((resolve, reject) => {
    recognition = new SR();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.continuous = true;
    let finalText = "";

    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
      }
    };
    recognition.onerror = (e) => reject(new Error(e.error));
    recognition.onend = () => resolve(finalText.trim());
    recognition.start();
  });
}

async function createSession() {
  const res = await fetch("/api/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mode: selectedMode }),
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  sessionId = data.sessionId;
  $modeButtons.forEach((b) => (b.disabled = true));
  return data;
}

async function submitTurn(text, responseTimeMs) {
  stopQuestionTimer();
  render("candidate", text);
  $status.textContent = "thinking...";
  $answer.disabled = true;

  try {
    const res = await fetch("/api/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, text, responseTimeMs }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    render("interviewer", data.speech, `${data.latencyMs}ms · ${data.assessment} · L${data.difficulty}`, data.assessment);
    setPhase(data.phase, data.difficulty);
    await speak(data.speech);

    $answer.disabled = false;
    $answer.textContent = "Start answering";
    $status.textContent = "your turn";
    beginQuestionTimer();
  } catch (err) {
    $status.textContent = "error: " + err.message;
    $answer.disabled = false;
    $answer.textContent = "Start answering";
  }
}

$uploadResume.onclick = async () => {
  const file = $resumeFile.files[0];
  if (!file) { $resumeStatus.textContent = "choose a pdf first"; return; }

  try {
    if (!sessionId) await createSession();
    $resumeStatus.textContent = "reading resume...";
    $uploadResume.disabled = true;

    const formData = new FormData();
    formData.append("resume", file);

    const res = await fetch(`/api/session/${sessionId}/resume`, { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    const projectNames = data.resumeSummary.projects.map((p) => p.name).join(", ") || "none found";
    $resumeStatus.textContent = `loaded — role: ${data.role} · projects: ${projectNames}`;
  } catch (err) {
    $resumeStatus.textContent = "could not read resume: " + err.message;
  } finally {
    $uploadResume.disabled = false;
  }
};

$start.onclick = async () => {
  $start.disabled = true;
  $status.textContent = "starting...";
  $summaryCard.classList.remove("active");
  try {
    if (!sessionId) await createSession();
    setPhase("warmup", 2);
    const opening = "Hi, thanks for joining. Let's start simple. Tell me about a project you've built recently.";
    render("interviewer", opening);
    await speak(opening);
    $status.textContent = "your turn";
    $answer.disabled = false;
    $end.disabled = false;
    beginQuestionTimer();
  } catch (err) {
    $status.textContent = "could not start: " + err.message;
    $start.disabled = false;
  }
};

$answer.onclick = async () => {
  if (!isListening) {
    isListening = true;
    setLive(true);
    $status.textContent = "listening...";
    $answer.textContent = "Stop and send";
    try {
      const text = await listen();
      isListening = false;
      setLive(false);
      $answer.textContent = "Start answering";

      const wasTimedOut = timedOut;
      const responseTimeMs = Date.now() - questionStartTime;

      if (!text && !wasTimedOut) {
        $status.textContent = "didn't catch that — try again";
        return;
      }

      const finalText = text || "(No answer was given before time ran out.)";
      await submitTurn(finalText, responseTimeMs);
    } catch (err) {
      isListening = false;
      setLive(false);
      $status.textContent = "error: " + err.message;
      $answer.disabled = false;
      $answer.textContent = "Start answering";
    }
  } else {
    recognition && recognition.stop();
  }
};

$end.onclick = async () => {
  stopQuestionTimer();
  try {
    const res = await fetch(`/api/session/${sessionId}/end`, { method: "POST" });
    const { stats } = await res.json();
    $status.textContent = "interview ended";
    renderSummary(stats);
    $answer.disabled = true;
    $end.disabled = true;
  } catch (err) {
    $status.textContent = "could not end: " + err.message;
  }
};
</script>
</body>
</html>
