<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    background: #0d1117;
    color: #e6e9f2;
    line-height: 1.6;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    color: #6b7385;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.5px;
    margin: 0 0 24px;
    color: #f4f5f8;
  }

  .session-bar {
    background: #161d2b;
    border: 1px solid #232b3d;
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .phase-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #9aa3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .phase-value {
    color: #f0b429;
    font-weight: 500;
  }

  .meter {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .meter-bars {
    display: flex;
    gap: 3px;
  }

  .meter-bar {
    width: 6px;
    height: 16px;
    border-radius: 2px;
    background: #232b3d;
    transition: background 0.3s ease, height 0.3s ease;
  }

  .meter-bar.filled {
    background: #f0b429;
  }

  .meter-bar:nth-child(1) { height: 10px; }
  .meter-bar:nth-child(2) { height: 13px; }
  .meter-bar:nth-child(3) { height: 16px; }
  .meter-bar:nth-child(4) { height: 19px; }
  .meter-bar:nth-child(5) { height: 22px; }

  .card {
    background: #161d2b;
    border: 1px solid #232b3d;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  input[type="file"] {
    font-size: 13px;
    color: #9aa3b8;
    max-width: 190px;
  }

  input[type="file"]::file-selector-button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #2a3350;
    background: #1e2740;
    color: #d6dae5;
    cursor: pointer;
    margin-right: 10px;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }

  button {
    font-family: 'Inter', sans-serif;
    padding: 13px 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 10px;
    border: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(0); }

  button:disabled {
    background: #1b2233 !important;
    color: #4a5268 !important;
    cursor: not-allowed;
    box-shadow: none !important;
  }

  #start {
    background: #f0b429;
    color: #22190a;
    box-shadow: 0 2px 10px rgba(240, 180, 41, 0.25);
  }

  #answer {
    background: #3ddc84;
    color: #06210f;
    box-shadow: 0 2px 10px rgba(61, 220, 132, 0.2);
  }

  #answer.recording {
    background: #ff5c72;
    color: #2b0509;
    box-shadow: 0 2px 14px rgba(255, 92, 114, 0.35);
  }

  #uploadResume, #end {
    background: transparent;
    color: #c3c9d9;
    border: 1px solid #2a3350;
  }

  #uploadResume:hover:not(:disabled), #end:hover:not(:disabled) {
    background: #1a2235;
    transform: none;
  }

  .live {
    display: none;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #ff8a9a;
    letter-spacing: 1px;
  }

  .live.active { display: flex; }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff5c72;
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,92,114,0.5); }
    50% { opacity: 0.5; box-shadow: 0 0 0 5px rgba(255,92,114,0); }
  }

  .wave {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 14px;
  }

  .wave span {
    width: 3px;
    background: #ff5c72;
    border-radius: 2px;
    animation: wave 0.9s ease-in-out infinite;
  }

  .wave span:nth-child(1) { animation-delay: 0s; }
  .wave span:nth-child(2) { animation-delay: 0.15s; }
  .wave span:nth-child(3) { animation-delay: 0.3s; }
  .wave span:nth-child(4) { animation-delay: 0.45s; }
  .wave span:nth-child(5) { animation-delay: 0.6s; }

  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 14px; }
  }

  #status, #resumeStatus {
    font-family: 'IBM Plex Mono', monospace;
    color: #6b7385;
    font-size: 13px;
    margin: 4px 0 24px;
    min-height: 18px;
  }

  #transcript {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .turn {
    padding: 16px 18px;
    border-radius: 14px;
    max-width: 85%;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .interviewer {
    background: #161d2b;
    border: 1px solid #232b3d;
    align-self: flex-start;
  }

  .candidate {
    background: #4d3fb0;
    color: #fff;
    align-self: flex-end;
  }

  .turn strong {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.55;
    margin-bottom: 6px;
    font-weight: 500;
  }

  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    margin-top: 10px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .meta.strong { color: #3ddc84; }
  .meta.partial { color: #f0b429; }
  .meta.weak { color: #ff5c72; }
  .candidate .meta { color: rgba(255,255,255,0.65); }
</style>
</head>
<body>
  <div class="eyebrow">Voice interview session</div>
  <h1>Interview Room</h1>

  <div class="session-bar">
    <div>
      <span class="phase-label">Phase</span>
      <span class="phase-value" id="phaseText">—</span>
    </div>
    <div class="meter">
      <span class="phase-label">Difficulty</span>
      <div class="meter-bars" id="meterBars">
        <div class="meter-bar"></div><div class="meter-bar"></div><div class="meter-bar"></div><div class="meter-bar"></div><div class="meter-bar"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <input type="file" id="resumeFile" accept=".pdf" />
    <button id="uploadResume">Upload resume</button>
  </div>
  <p id="resumeStatus"></p>

  <div class="controls">
    <button id="start">Start interview</button>
    <button id="answer" disabled>Start answering</button>
    <button id="end" disabled>End interview</button>
    <div class="live" id="liveIndicator">
      <div class="live-dot"></div>
      <span>LIVE</span>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </div>
  <p id="status"></p>

  <div id="transcript"></div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) document.getElementById("status").textContent = "Use Chrome or Edge — this browser lacks speech recognition.";

let sessionId = null;
let recognition = null;
let isListening = false;

const $status = document.getElementById("status");
const $transcript = document.getElementById("transcript");
const $start = document.getElementById("start");
const $answer = document.getElementById("answer");
const $end = document.getElementById("end");
const $resumeFile = document.getElementById("resumeFile");
const $uploadResume = document.getElementById("uploadResume");
const $resumeStatus = document.getElementById("resumeStatus");
const $phaseText = document.getElementById("phaseText");
const $meterBars = document.getElementById("meterBars").children;
const $liveIndicator = document.getElementById("liveIndicator");

function setPhase(phase, difficulty) {
  $phaseText.textContent = phase;
  for (let i = 0; i < 5; i++) {
    $meterBars[i].classList.toggle("filled", i < difficulty);
  }
}

function setLive(on) {
  $liveIndicator.classList.toggle("active", on);
  $answer.classList.toggle("recording", on);
}

function render(role, text, meta, assessment) {
  const div = document.createElement("div");
  div.className = "turn " + role;
  div.innerHTML = `<strong>${role === "interviewer" ? "Interviewer" : "You"}:</strong> ${text}`
    + (meta ? `<div class="meta ${assessment || ''}">${meta}</div>` : "");
  $transcript.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

function speak(text) {
  return new Promise((resolve) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function listen() {
  return new Promise((resolve, reject) => {
    recognition = new SR();
    recognition.lang = "en-IN";
    recognition.interimResults = false;
    recognition.continuous = true;
    let finalText = "";

    recognition.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
      }
    };
    recognition.onerror = (e) => reject(new Error(e.error));
    recognition.onend = () => resolve(finalText.trim());
    recognition.start();
  });
}

async function createSession() {
  const res = await fetch("/api/session", { method: "POST" });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
  sessionId = data.sessionId;
  return data;
}

$uploadResume.onclick = async () => {
  const file = $resumeFile.files[0];
  if (!file) { $resumeStatus.textContent = "choose a pdf first"; return; }

  try {
    if (!sessionId) await createSession();
    $resumeStatus.textContent = "reading resume...";
    $uploadResume.disabled = true;

    const formData = new FormData();
    formData.append("resume", file);

    const res = await fetch(`/api/session/${sessionId}/resume`, { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    const projectNames = data.resumeSummary.projects.map((p) => p.name).join(", ") || "none found";
    $resumeStatus.textContent = `loaded — role: ${data.role} · projects: ${projectNames}`;
  } catch (err) {
    $resumeStatus.textContent = "could not read resume: " + err.message;
  } finally {
    $uploadResume.disabled = false;
  }
};

$start.onclick = async () => {
  $start.disabled = true;
  $status.textContent = "starting...";
  try {
    if (!sessionId) await createSession();
    setPhase("warmup", 2);
    const opening = "Hi, thanks for joining. Let's start simple. Tell me about a project you've built recently.";
    render("interviewer", opening);
    await speak(opening);
    $status.textContent = "your turn";
    $answer.disabled = false;
    $end.disabled = false;
  } catch (err) {
    $status.textContent = "could not start: " + err.message;
    $start.disabled = false;
  }
};

$answer.onclick = async () => {
  if (!isListening) {
    isListening = true;
    setLive(true);
    $status.textContent = "listening...";
    $answer.textContent = "Stop and send";
    try {
      const text = await listen();
      isListening = false;
      setLive(false);
      $answer.textContent = "Start answering";

      if (!text) { $status.textContent = "didn't catch that — try again"; return; }

      render("candidate", text);
      $status.textContent = "thinking...";
      $answer.disabled = true;

      const res = await fetch("/api/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, text }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

      render("interviewer", data.speech, `${data.latencyMs}ms · ${data.assessment} · L${data.difficulty}`, data.assessment);
      setPhase(data.phase, data.difficulty);
      await speak(data.speech);

      $answer.disabled = false;
      $status.textContent = "your turn";
    } catch (err) {
      isListening = false;
      setLive(false);
      $status.textContent = "error: " + err.message;
      $answer.disabled = false;
      $answer.textContent = "Start answering";
    }
  } else {
    recognition && recognition.stop();
  }
};

$end.onclick = async () => {
  try {
    const res = await fetch(`/api/session/${sessionId}/end`, { method: "POST" });
    const { stats } = await res.json();
    $status.textContent = `done — ${stats.turnCount} turns · peak L${stats.peakDifficulty}/5 · avg L${stats.avgDifficulty} · p50 ${stats.p50LatencyMs}ms · ${stats.assessments.strong} strong / ${stats.assessments.partial} partial / ${stats.assessments.weak} weak`;
    $answer.disabled = true;
    $end.disabled = true;
  } catch (err) {
    $status.textContent = "could not end: " + err.message;
  }
};
</script>
</body>
</html>
